name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TeamActivity.slnx
      - name: Build
        run: dotnet build TeamActivity.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TeamActivity.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage"
      - name: Dependency vulnerability audit
        run: dotnet list TeamActivity.slnx package --vulnerable --include-transitive
      - name: Package preview
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: TeamActivity-0.1.0-win-x64
          path: artifacts/release/*
          if-no-files-found: error
