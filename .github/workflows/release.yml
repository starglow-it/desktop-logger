name: Publish v0.1.0 preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check whether preview release exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
      - name: Restore
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore TeamActivity.slnx
      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: dotnet build TeamActivity.slnx --configuration Release --no-restore
      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: dotnet test TeamActivity.slnx --configuration Release --no-build
      - name: Package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version 0.1.0
      - name: Attest release bundle
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/TeamActivity-0.1.0-win-x64.zip
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 `
            artifacts/release/TeamActivity-0.1.0-win-x64.zip `
            artifacts/release/TeamActivity-0.1.0-win-x64.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "TeamActivity 0.1.0 security foundation preview" `
            --notes-file docs/RELEASE_NOTES_0.1.0.md `
            --prerelease
